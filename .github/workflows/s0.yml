name: s0
on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  s0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: KVM writable
        run: ls -l /dev/kvm && test -w /dev/kvm
      - name: Machine before
        if: always()
        run: nproc; free -g; df -h /
      - name: Cold build
        run: time nix build -L .#checks.x86_64-linux.hello
      - name: Disk after
        if: always()
        run: df -h /
